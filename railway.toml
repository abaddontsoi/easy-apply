[build]
builder = "NIXPACKS"
# npm run build loads Infisical when INFISICAL_ID, INFISICAL_TOKEN, and INFISICAL_ENV are set.
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
